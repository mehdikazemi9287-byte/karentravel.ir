# Use with docker-compose.yml after creating these external Docker secrets from an authorized secret manager.
services:
  api:
    environment:
      DATABASE_URL: null
      JWT_SECRET: null
      REDIS_URL: null
      DATABASE_URL_FILE: /run/secrets/karenseir_database_url
      JWT_SECRET_FILE: /run/secrets/karenseir_jwt_secret
      REDIS_URL_FILE: /run/secrets/karenseir_redis_url
    secrets:
      - source: karenseir_database_url
        target: karenseir_database_url
        mode: 0400
      - source: karenseir_jwt_secret
        target: karenseir_jwt_secret
        mode: 0400
      - source: karenseir_redis_url
        target: karenseir_redis_url
        mode: 0400
  worker:
    environment:
      DATABASE_URL: null
      JWT_SECRET: null
      REDIS_URL: null
      DATABASE_URL_FILE: /run/secrets/karenseir_worker_database_url
      JWT_SECRET_FILE: /run/secrets/karenseir_jwt_secret
      REDIS_URL_FILE: /run/secrets/karenseir_redis_url
    secrets:
      - source: karenseir_worker_database_url
        target: karenseir_worker_database_url
        mode: 0400
      - source: karenseir_jwt_secret
        target: karenseir_jwt_secret
        mode: 0400
      - source: karenseir_redis_url
        target: karenseir_redis_url
        mode: 0400
  db:
    environment:
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/karenseir_postgres_password
    secrets:
      - source: karenseir_postgres_password
        target: karenseir_postgres_password
        mode: 0400

secrets:
  karenseir_database_url:
    external: true
  karenseir_worker_database_url:
    external: true
  karenseir_jwt_secret:
    external: true
  karenseir_redis_url:
    external: true
  karenseir_postgres_password:
    external: true
