<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3a1b3d">
<title>اتصال برقرار نیست | کارن تراول</title>
<style>
  :root{--plum:#3a1b3d;--coral:#ef5b3d;--cream:#fdf5ea;--muted:#6e5e70}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--cream);color:var(--plum);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9;padding:24px}
  main{max-width:420px;text-align:center;display:grid;gap:14px;justify-items:center}
  img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(58,27,61,.18)}
  h1{font-size:22px;margin:8px 0 0}
  p{margin:0;color:var(--muted);font-size:15px}
  button{margin-top:8px;font:inherit;font-weight:800;color:#fff;background:var(--coral);border:0;border-radius:14px;padding:12px 26px;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/app-icons/icon-192.png" alt="کارن تراول">
  <h1>اتصال اینترنت برقرار نیست</h1>
  <p>برای دیدن سفرها، کیف پول و قیمت‌های به‌روز، اینترنت لازم است. هر وقت وصل شدید دوباره امتحان کنید.</p>
  <button type="button" onclick="location.reload()">تلاش دوباره</button>
</main>
</body>
</html>
