# Prepared for reference host 95.38.184.209. Activate only after DNS and certificates exist.
# Install under http{}; upstream application ports must then be bound to loopback.
limit_req_zone $binary_remote_addr zone=karentravel_api:10m rate=20r/s;
server {
    listen 80;
    server_name karentravel.ir;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://karentravel.ir$request_uri; }
}
server {
    listen 80;
    server_name api.karentravel.ir;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://api.karentravel.ir$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name karentravel.ir;
    ssl_certificate /etc/letsencrypt/live/karentravel.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karentravel.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host karentravel.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl http2;
    server_name api.karentravel.ir;
    ssl_certificate /etc/letsencrypt/live/api.karentravel.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.karentravel.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 16m;
    # Callback query strings contain signed state. Do not write them into access logs.
    location = /payments/zarinpal/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host api.karentravel.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location / {
        limit_req zone=karentravel_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host api.karentravel.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
